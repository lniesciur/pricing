name: CI

on:
  push:
    branches: [ main, feature/** ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Pricing.slnx

      - name: Build
        run: dotnet build Pricing.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Pricing.slnx --no-build --configuration Release --verbosity normal --logger trx --results-directory ./test-results

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: xUnit Tests
          path: test-results/**/*.trx
          reporter: dotnet-trx
